[program:sailor-backend]
command=/opt/sailor-campus/backend/venv/bin/gunicorn main:app -w 2 -k uvicorn.workers.UvicornWorker -b 127.0.0.1:8000 --access-logfile /var/log/sailor-backend/access.log --error-logfile /var/log/sailor-backend/error.log --log-level info --preload
directory=/opt/sailor-campus/backend
user=www
autostart=true
autorestart=true
stdout_logfile=/var/log/sailor-backend/stdout.log
stderr_logfile=/var/log/sailor-backend/stderr.log
environment=PYTHONPATH="/opt/sailor-campus/backend"
