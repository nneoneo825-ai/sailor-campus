name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: 前端 (类型检查 + 构建)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

      - name: 生产构建
        run: npm run build

  backend:
    name: 后端 (pytest)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sailor_campus_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 安装依赖
        run: pip install -r backend/requirements-dev.txt

      - name: 运行测试
        working-directory: backend
        env:
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/sailor_campus_test
          SECRET_KEY: ci-test-secret-key
          BUILTIN_ADMIN_PASSWORD: ""
        run: pytest
